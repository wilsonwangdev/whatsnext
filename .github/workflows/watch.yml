name: watch

on:
  schedule:
    # 每周一 01:00 UTC（北京时间 09:00）
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: https://wilsonwangdev.github.io
          BASE_PATH: /postclose/
        run: node scripts/watch.mjs > report.md

      - name: Ensure watch label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh label create watch --color FBCA04 --description "自动监测待核验" 2>/dev/null || true

      - name: Create or update review issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          number=$(gh issue list --label watch --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "每周监测 $(date -u +%F)" --label watch --body-file report.md
          fi
