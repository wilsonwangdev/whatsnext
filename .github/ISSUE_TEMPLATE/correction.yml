name: 提交纠错
description: 报告事实错误、过期信息或失效来源
title: '[纠错] '
labels: ['correction']
body:
  - type: input
    id: page
    attributes:
      label: 页面链接
      placeholder: https://wilsonwangdev.github.io/whatsnext/cases/bun
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: 错误类型
      options:
        - 日期错误
        - 金额 / 对价错误
        - 交易结构表述错误
        - 主体或名称错误
        - 后续事件已过期
        - 来源失效
        - 其他
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: 当前表述
      description: 引用页面上的原文。
    validations:
      required: true

  - type: textarea
    id: correction
    attributes:
      label: 正确信息
    validations:
      required: true

  - type: textarea
    id: sources
    attributes:
      label: 来源
      description: 请提供可核验的一手来源；如果是链接失效，请附 Wayback Machine 存档。
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已尽量核对来源，并理解维护者可能会回查原始文件。
          required: true
